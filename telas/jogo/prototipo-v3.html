<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOGA — Protótipo v3</title>
<style>
/* ============================================================
   JOGA — Protótipo v3
   Paleta chapada:
   claro: fundo #F1F3F0 · superfície #FFFFFF · superfície 2 #E7EAE7
   tinta #17191B · texto 2 #62686E · linha #D5D9D6
   acento #E53935 (único acento)
   escuro: fundo #15171A · superfície #1E2125 · elevada #292D32
   tinta #F1F3F0 · texto 2 #A6ABB1 · linha #383D43
   acento #E53935 (único acento); estados usam neutros
   Tipografia: system-ui / -apple-system / Segoe UI / Roboto
   Raio: 18px · alvo de toque: 44px · sem glow, neon, blur
   ou gradiente luminoso. Sombra só como profundidade.
   ============================================================ */
:root{
  --bg:#F1F3F0;
  --surface:#FFFFFF;
  --surface-2:#E7EAE7;
  --surface-3:#E7EAE7;
  --ink:#17191B;
  --ink-soft:#62686E;
  --muted:#62686E;
  --muted-2:#62686E;
  --line:#D5D9D6;
  --line-strong:#D5D9D6;
  --lime:#E53935;
  --lime-deep:#E53935;
  --lime-soft:#E7EAE7;
  --blue:#62686E;
  --blue-soft:#E7EAE7;
  --green:#62686E;
  --green-soft:#E7EAE7;
  --orange:#E53935;
  --orange-soft:#E7EAE7;
  --red:#62686E;
  --red-soft:#E7EAE7;
  --radius:18px;
  --radius-sm:10px;
  --tap:48px;
  --shadow:0 1px 0 rgba(23,25,27,.04), 0 12px 24px -18px rgba(23,25,27,.25);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:#E7EAE7;
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.45;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{display:block}
::selection{background:var(--lime);color:var(--ink)}

/* ---------- shell ---------- */
.app-shell{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;overflow:auto;
  background:var(--ink);color:#F1F3F0;padding:22px 16px 28px;
  border-right:1px solid #15171A;
}
.brand{display:flex;align-items:flex-end;gap:10px;padding:0 6px 18px;border-bottom:1px solid #383D43}
.brand-mark{font-size:34px;font-weight:950;letter-spacing:-.06em;line-height:.9;text-transform:uppercase}
.brand-mark span{color:var(--lime)}
.brand-sub{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#A6ABB1;padding-bottom:3px}
.side-search{width:100%;height:46px;border:1px solid #383D43;background:#292D32;color:#F1F3F0;border-radius:12px;padding:0 12px;margin:16px 0 10px;outline:none}
.side-search::placeholder{color:#A6ABB1}
.side-search:focus{border-color:var(--lime);outline:2px solid var(--lime);outline-offset:1px}
.side-group{margin-top:16px}
.side-group-title{font-size:10px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:#A6ABB1;padding:0 8px 7px}
.side-link{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  border:1px solid transparent;background:transparent;color:#D5D9D6;
  border-radius:10px;padding:8px 9px;min-height:38px;font-size:12.5px;line-height:1.25;
}
.side-link:hover{background:#292D32;color:#F1F3F0}
.side-link.on{background:#292D32;color:#F1F3F0;border-color:var(--line);border-left:3px solid var(--lime);font-weight:750}
.side-num{font-size:10px;font-weight:800;color:#A6ABB1;width:22px;flex:none;font-variant-numeric:tabular-nums}
.side-link.on .side-num{color:#A6ABB1}
.side-empty{color:#A6ABB1;font-size:12px;padding:12px 8px}
.side-foot{margin-top:24px;padding:14px 8px 0;border-top:1px solid #383D43;color:#A6ABB1;font-size:11px;line-height:1.5}

.stage{padding:26px 32px 64px;display:flex;flex-direction:column;align-items:center;min-width:0}
.stage-head{width:100%;max-width:760px;margin-bottom:20px}
.stage-kicker{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage-kicker b{color:var(--ink)}
.stage-title{font-size:clamp(26px,4vw,44px);line-height:.98;font-weight:950;text-transform:uppercase;letter-spacing:-.03em;margin:8px 0 10px}
.stage-meta{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.stage-decision{max-width:560px;color:var(--ink-soft);font-size:14px;line-height:1.5;flex:1;min-width:240px}
.stage-tools{display:flex;gap:8px;margin-top:14px}
.tool-btn{min-height:44px;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:0 12px;font-weight:700;font-size:13px}
.tool-btn:hover{border-color:var(--ink)}

/* ---------- device ---------- */
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.device{
  position:relative;width:375px;height:812px;background:var(--bg);
  border:1px solid #17191B;border-radius:38px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 22px 54px -24px rgba(23,25,27,.45);
}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:800;letter-spacing:.2px}
.status-icons{display:flex;align-items:center;gap:6px}
.status-icons .sig{display:flex;gap:2px;align-items:flex-end;height:10px}
.status-icons .sig i{width:3px;background:var(--ink);border-radius:1px}
.status-icons .sig i:nth-child(1){height:4px}.status-icons .sig i:nth-child(2){height:6px}.status-icons .sig i:nth-child(3){height:8px}.status-icons .sig i:nth-child(4){height:10px}
.battery{width:20px;height:10px;border:1.5px solid var(--ink);border-radius:2px;position:relative}
.battery::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:var(--ink);border-radius:1px}
.battery i{display:block;height:100%;width:72%;background:var(--ink)}
.viewport{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.viewport::-webkit-scrollbar{display:none}
.phone-header{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;min-height:54px;flex:none;background:var(--bg);position:sticky;top:0;z-index:5}
.phone-header .grow{flex:1;min-width:0}
.topbar-title{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;line-height:1.1}
.topbar-sub{font-size:13px;color:var(--muted);margin-top:2px}
.phone-body{padding:0 16px 26px;display:flex;flex-direction:column;gap:14px}
.phone-body.flush{padding:0 0 26px}
.phone-body.center{text-align:center;align-items:center}
.device-caption{font-size:11px;color:var(--muted);letter-spacing:.4px}

/* ---------- tabbar ---------- */
.tabbar{height:76px;flex:none;border-top:1.5px solid var(--line);background:var(--surface);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px 5px 10px}
.tab{position:relative;border:0;background:transparent;border-radius:12px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.2px}
.tab .ic{width:20px;height:20px}
.tab.on{background:transparent;color:var(--ink)}
.tab.on .ic{color:var(--lime)}
.tab.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--lime)}
.tab:active{transform:translateY(1px)}

/* ---------- typography ---------- */
.display{font-weight:950;text-transform:uppercase;letter-spacing:-.03em;line-height:.96}
.h1{font-size:30px;font-weight:950;text-transform:uppercase;letter-spacing:-.03em;line-height:.98}
.h1.xl{font-size:38px}
.h2{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
.h3{font-size:15px;font-weight:850;text-transform:uppercase;letter-spacing:.4px;line-height:1.2}
.lead{font-size:15px;line-height:1.5;color:var(--ink-soft)}
.sub{font-size:14px;line-height:1.5;color:var(--muted)}
.sub b{color:var(--ink);font-weight:750}
.tiny{font-size:14px;line-height:1.4;color:var(--muted)}
.label{font-size:11px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:950;letter-spacing:-.03em}
.mono{font-variant-numeric:tabular-nums}
.center{text-align:center}
.grow{flex:1;min-width:0}
.mt0{margin-top:0}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* ---------- buttons ---------- */
.btn{
  width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line-strong);
  background:var(--ink);color:#F1F3F0;display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:15px;font-weight:800;letter-spacing:.1px;padding:0 16px;text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--lime);color:#F1F3F0;border-color:var(--line-strong)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border-color:transparent}
.btn.ghost:hover{border-color:var(--lime);color:var(--ink)}
body.dark .card.ink .btn.ghost{border-color:var(--lime)}
.card.lime .btn.ghost,.card.blue .btn.ghost,.card.green .btn.ghost,.card.orange .btn.ghost,.card.red .btn.ghost{border-color:var(--lime)}
.btn.soft{background:var(--surface-2);color:var(--ink);border-color:var(--surface-3)}
.btn.danger{background:var(--red);color:#F1F3F0;border-color:var(--red)}
.btn.sm{min-height:46px;border-radius:11px;font-size:14px;width:auto;padding:0 14px}
.btn.block{width:100%}
.btn[disabled],.btn.disabled{opacity:.38;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.text-btn{border:0;background:transparent;color:var(--ink);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:46px;padding:0 2px}
.text-btn.muted{color:var(--muted);font-weight:700}
.icon-btn{width:46px;height:46px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn.plain{border-color:transparent;background:transparent}
.icon-btn.ink{background:var(--ink);border-color:var(--ink);color:#F1F3F0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic.lg{width:26px;height:26px}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{background:var(--surface-2);border-color:var(--surface-3);box-shadow:none}
.card.ink{background:var(--ink);border-color:var(--line);color:#F1F3F0}
.card.ink .sub,.card.ink .tiny,.card.ink .label{color:#A6ABB1}
.card.ink .h2,.card.ink .h3{color:#F1F3F0}
.card.lime{background:var(--lime-soft);border-color:var(--line)}
.card.blue{background:var(--blue-soft);border-color:#D5D9D6}
.card.green{background:var(--green-soft);border-color:#D5D9D6}
.card.orange{background:var(--orange-soft);border-color:#D5D9D6}
.card.red{background:var(--red-soft);border-color:#D5D9D6}
.card.pad-sm{padding:12px}
.card.tight{padding:14px}
.card-list{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card-list>*{padding:15px 18px;border-bottom:1px solid var(--line)}
.card-list>*:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.row.wrap{flex-wrap:wrap}
.divider{height:1.5px;background:var(--line);border:0;margin:2px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:850;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:750;line-height:1}
.pill[data-go]{min-height:46px;padding:8px 12px}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:10.5px;font-weight:850;letter-spacing:.6px;text-transform:uppercase;line-height:1;white-space:nowrap}
.badge.lime{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.badge.blue{background:var(--blue-soft);border-color:#D5D9D6;color:#17191B}
.badge.green{background:var(--green-soft);border-color:#D5D9D6;color:#17191B}
.badge.orange{background:var(--orange-soft);border-color:#D5D9D6;color:#17191B}
.badge.red{background:var(--red-soft);border-color:#D5D9D6;color:#17191B}
.badge.ink{background:var(--ink);border-color:var(--ink);color:#F1F3F0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.orange{background:var(--orange)}.dot.red{background:var(--red)}.dot.blue{background:var(--blue)}.dot.muted{background:var(--muted-2)}

/* ---------- progress ---------- */
.progress{height:14px;border:1.5px solid var(--line-strong);border-radius:999px;background:#D5D9D6;overflow:hidden}
.progress span{display:block;height:100%;background:var(--lime);border-right:1.5px solid var(--line-strong)}
.progress.blue span,.progress.green span,.progress.orange span{background:var(--lime)}
.progress.thin{height:9px;border-width:1px}
.progress.thin span{border-right-width:1px}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:9px;border-radius:2px;background:#D5D9D6;border:1px solid var(--line)}
.meter i.on{background:var(--lime);border-color:var(--lime)}
.meter.blue i.on,.meter.orange i.on{background:var(--lime);border-color:var(--lime)}

/* ---------- chips / seg ---------- */
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:9px 12px;font-size:13px;font-weight:750;min-height:46px;display:inline-flex;align-items:center;gap:6px;line-height:1}
.chip.on{background:var(--ink);color:#F1F3F0;border-color:var(--ink)}
.chip.lime.on{background:var(--lime);color:var(--ink);border-color:var(--ink)}
.chip .ic{width:14px;height:14px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:46px;font-size:13px;font-weight:800;color:var(--muted);padding:0 8px}
.seg button.on{background:var(--ink);color:#F1F3F0}
.seg.lime button.on{background:var(--lime);color:var(--ink)}
.seg.sm button{min-height:46px;font-size:12px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;font-weight:850;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:52px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:13px 14px;outline:none;font-size:14px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}
.textarea{min-height:110px;resize:vertical}
.input-row{display:flex;gap:8px}
.input-row .input{flex:1}
.input-prefix{display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);overflow:hidden}
.input-prefix span{padding:0 12px;font-weight:800;color:var(--muted);border-right:1.5px solid var(--line)}
.input-prefix .input{border:0;border-radius:0}
.check{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.45;min-height:44px}
.check input{width:22px;height:22px;flex:none;accent-color:var(--ink);margin-top:1px}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:46px;height:56px;text-align:center;font-size:24px;font-weight:900;border:1.5px solid var(--line-strong);border-radius:11px;background:var(--surface);padding:0}
.otp input:focus{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}

/* ---------- avatars ---------- */
.avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;background:var(--surface-2);border:1.5px solid var(--line)}
.avatar svg{width:100%;height:100%;display:block}
.avatar.sm{width:34px;height:34px}
.avatar.lg{width:86px;height:86px}
.avatar.xl{width:112px;height:112px;border-width:2px}
.avatar-stack{display:flex}
.avatar-stack .avatar{margin-left:-10px;border:2px solid var(--surface)}
.avatar-stack .avatar:first-child{margin-left:0}
.avatar-ring{display:inline-flex;padding:3px;border:2px solid var(--line-strong);border-radius:50%}

/* ---------- timers ---------- */
.timer{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer .t-label{font-size:10.5px;font-weight:850;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.timer .t-value{font-size:18px;font-weight:950;font-variant-numeric:tabular-nums;line-height:1.1}
.timer .t-note{font-size:11px;color:var(--muted);margin-top:2px}
.timer.on{border-color:var(--line-strong);background:var(--lime-soft)}
.timer.done{background:var(--surface-2)}
.timer.late{border-color:var(--red);background:var(--red-soft)}

/* ---------- notices / states ---------- */
.notice{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--surface-2);display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--ink-soft)}
.notice .ic{flex:none;margin-top:1px}
.notice.lime{background:var(--lime-soft);border-color:var(--line);color:#17191B}
.notice.blue{background:var(--blue-soft);border-color:#D5D9D6;color:#17191B}
.notice.orange{background:var(--orange-soft);border-color:#D5D9D6;color:#17191B}
.notice.red{background:var(--red-soft);border-color:#D5D9D6;color:#17191B}
.notice.green{background:var(--green-soft);border-color:#D5D9D6;color:#17191B}
.state{padding:28px 8px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.state .state-icon{width:72px;height:72px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.state .state-icon .ic{width:32px;height:32px}
.state h1{font-size:28px;font-weight:950;text-transform:uppercase;letter-spacing:-.03em;line-height:1;max-width:300px}
.state p{font-size:14px;color:var(--muted);line-height:1.5;max-width:300px}
.state .state-actions{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.skeleton{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:16px}
.skeleton.w60{width:60%}.skeleton.w80{width:80%}.skeleton.w40{width:40%}
.skeleton-card{height:92px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.welcome-court{background:var(--ink);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.welcome-court svg{width:100%;height:auto;display:block}
.welcome-court-meta{padding:8px 14px 9px;border-top:1px solid #383D43;color:#A6ABB1;font-size:11px;font-weight:850;letter-spacing:1.4px;text-transform:uppercase}
.welcome-head{padding:2px 0 0}
.welcome-head .h1{margin:6px 0 6px}
.welcome-list{list-style:none;display:flex;flex-direction:column;gap:9px;padding:0}
.welcome-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ink-soft)}
.check-dot{width:24px;height:24px;border-radius:50%;background:var(--lime);color:#F1F3F0;display:grid;place-items:center;flex:none;margin-top:-1px}
.check-dot .ic{width:14px;height:14px;stroke-width:2.8}
.avatar-panel{display:none}
.avatar-panel.on{display:block}
.avatar-option{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;min-height:44px}
.avatar-option.on{border-color:var(--line-strong);background:var(--lime-soft)}
.empty{padding:26px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.empty .empty-ico{width:56px;height:56px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.empty h3{font-size:16px;font-weight:900;text-transform:uppercase}
.empty p{font-size:13px;color:var(--muted);max-width:280px}

/* ---------- lists / teams ---------- */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{min-width:0}
.list-title{font-size:14px;font-weight:800;line-height:1.2}
.list-sub{font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.team{border:1.5px solid var(--line);border-radius:14px;padding:11px;background:var(--surface)}
.team-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.team-name{font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.player{display:flex;align-items:center;gap:8px;padding:6px 0}
.player .avatar{width:30px;height:30px}
.player .p-name{font-size:12.5px;font-weight:750;line-height:1.1}
.player .p-role{font-size:10.5px;color:var(--muted)}
.player .cap{margin-left:auto;color:var(--lime-deep)}

/* ---------- photo / art ---------- */
.photo{border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:var(--surface-2)}
.photo svg{width:100%;height:auto;display:block}
.photo-cap{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font-size:11px;color:var(--muted);background:var(--surface)}
.qr{width:168px;height:168px;border:1.5px solid var(--line-strong);border-radius:8px;padding:8px;background:#F1F3F0;margin:0 auto}
.qr svg{width:100%;height:100%}

/* ---------- heat / chart ---------- */
.heat{display:grid;grid-template-columns:34px repeat(7,1fr);gap:4px;align-items:center}
.heat .h-label{font-size:10px;font-weight:800;color:var(--muted);text-align:center}
.heat .h-time{font-size:10px;color:var(--muted);font-weight:700;text-align:right;padding-right:2px}
.heat i{height:26px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.h1{background:#E7EAE7}.heat i.h2{background:#D5D9D6}.heat i.h3{background:#A6ABB1}.heat i.h4{background:#E53935}
.heat i.empty{background:var(--surface);border-style:dashed}
.chart{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:10px}
.chart svg{width:100%;height:auto}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.bar-row .bar-label{width:76px;color:var(--muted);font-weight:700;flex:none}
.bar-track{flex:1;height:14px;background:#D5D9D6;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--lime)}
.bar-row b{width:30px;text-align:right;font-size:12px}

/* ---------- track ---------- */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.node{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 4px;text-align:center;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.node .n-lvl{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums}
.node .n-state{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.node.done{background:var(--surface-2);border-color:var(--line-strong)}
.node.current{background:var(--lime);border-color:var(--line-strong);color:#F1F3F0}
.node.locked{opacity:.55;border-style:dashed}
.node.milestone{border-color:var(--line-strong)}
.node .n-item{font-size:9px;font-weight:800;color:var(--lime-deep)}
.node.current .n-item{color:var(--ink)}
.milestone-card{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.milestone-card .m-lvl{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#F1F3F0;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.milestone-card.pass .m-lvl{background:var(--blue);color:#F1F3F0}
.milestone-card.locked{opacity:.6;border-style:dashed}

/* ---------- modal / toast ---------- */
.modal-root{position:absolute;inset:0;z-index:60;display:none}
.modal-root.on{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(23,25,27,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line-strong);border-radius:22px 22px 0 0;padding:16px 16px 26px;max-height:78%;overflow:auto}
.sheet-handle{width:44px;height:5px;border-radius:999px;background:var(--line-strong);margin:0 auto 14px}
.sheet h2{font-size:20px;font-weight:950;text-transform:uppercase;letter-spacing:-.02em;line-height:1.05;margin-bottom:6px}
.sheet p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#F1F3F0;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:700;z-index:100;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}

/* ---------- tema escuro ---------- */
body.dark{
  --bg:#15171A;
  --surface:#1E2125;
  --surface-2:#292D32;
  --surface-3:#292D32;
  --ink:#F1F3F0;
  --ink-soft:#A6ABB1;
  --muted:#A6ABB1;
  --muted-2:#A6ABB1;
  --line:#383D43;
  --line-strong:#383D43;
  --lime:#E53935;
  --lime-deep:#E53935;
  --lime-soft:#292D32;
  --blue:#A6ABB1;
  --blue-soft:#292D32;
  --green:#A6ABB1;
  --green-soft:#292D32;
  --orange:#E53935;
  --orange-soft:#292D32;
  --red:#E53935;
  --red-soft:#292D32;
  --shadow:0 1px 0 rgba(21,23,26,.2),0 12px 24px -18px rgba(21,23,26,.7);
  background:#15171A;
  color:var(--ink);
}
body.dark .sidebar{background:#15171A;border-right-color:#383D43;color:#F1F3F0}
body.dark .side-search{background:#292D32;border-color:#383D43;color:#F1F3F0}
body.dark .side-link{color:#D5D9D6}
body.dark .side-link:hover{background:#292D32;color:#F1F3F0}
body.dark .side-link.on{background:var(--surface-2);color:#F1F3F0;border-color:var(--line);border-left:3px solid var(--lime)}
body.dark .side-link.on .side-num{color:#A6ABB1}
body.dark .device{background:var(--bg);border-color:#383D43}
body.dark .card.ink{background:var(--surface-2);border-color:var(--line)}
body.dark .btn{background:var(--ink);color:#15171A;border-color:var(--line-strong)}
body.dark .btn.primary{background:var(--lime);color:#F1F3F0;border-color:var(--line-strong)}
body.dark .btn.ghost{background:var(--surface-2);color:#F1F3F0;border-color:transparent}
body.dark .btn.danger{background:var(--red);color:#F1F3F0;border-color:var(--red)}
body.dark .milestone-card .m-lvl{background:var(--surface-2);color:var(--lime);border:1px solid var(--line)}
body.dark .milestone-card.pass .m-lvl{background:var(--surface-2);color:var(--lime);border-color:var(--line)}
body.dark .icon-btn.ink{background:var(--lime);color:#F1F3F0;border-color:var(--lime)}
body.dark .badge.ink{background:var(--surface-2);color:var(--lime);border-color:var(--line)}
body.dark .chip.on{background:var(--surface-2);color:var(--lime);border-color:var(--line-strong)}
body.dark .seg button.on{background:var(--surface-2);color:var(--lime);border:1px solid var(--lime)}
body.dark .tab.on{background:transparent;color:var(--ink)}
body.dark .tab.on .ic{color:var(--lime)}
body.dark .tab.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--lime)}
body.dark .node.current .n-state,body.dark .node.current .n-item{color:#F1F3F0}
body.dark .status-icons .sig i,body.dark .battery::after,body.dark .battery i{background:var(--ink)}
body.dark .battery{border-color:var(--ink)}
body.dark .progress{background:#383D43}
body.dark .bar-track{background:#383D43}
body.dark .bar-track i{background:var(--lime)}
body.dark .meter i{background:#383D43;border-color:#383D43}
body.dark .meter i.on{background:var(--lime);border-color:var(--lime)}
body.dark .badge{background:var(--surface-2);border-color:var(--line);color:var(--ink-soft)}
body.dark .badge.lime{background:var(--surface-2);border-color:var(--line);color:var(--lime)}
body.dark .badge.blue{background:var(--blue-soft);border-color:#383D43;color:#F1F3F0}
body.dark .badge.green{background:var(--green-soft);border-color:#383D43;color:#F1F3F0}
body.dark .badge.orange{background:var(--orange-soft);border-color:#383D43;color:#F1F3F0}
body.dark .badge.red{background:var(--red-soft);border-color:#383D43;color:#F1F3F0}
body.dark .notice{background:var(--surface-2);border-color:var(--line);color:var(--ink-soft)}
body.dark .notice.lime{background:var(--lime-soft);border-color:var(--line);color:var(--ink-soft)}
body.dark .notice.blue{background:var(--blue-soft);border-color:#383D43;color:#F1F3F0}
body.dark .notice.orange{background:var(--orange-soft);border-color:#383D43;color:#F1F3F0}
body.dark .notice.red{background:var(--red-soft);border-color:#383D43;color:#F1F3F0}
body.dark .notice.green{background:var(--green-soft);border-color:#383D43;color:#F1F3F0}
body.dark .card.lime{background:var(--lime-soft);border-color:var(--line)}
body.dark .timer.on{border-color:var(--line-strong)}
body.dark .avatar-option.on{border-color:var(--line-strong)}
body.dark .card.blue{background:var(--blue-soft);border-color:#383D43}
body.dark .card.green{background:var(--green-soft);border-color:#383D43}
body.dark .card.orange{background:var(--orange-soft);border-color:#383D43}
body.dark .card.red{background:var(--red-soft);border-color:#383D43}
body.dark .toast{background:var(--lime);color:#F1F3F0}
body.dark .heat i.h1{background:#1E2125}
body.dark .heat i.h2{background:#292D32}
body.dark .heat i.h3{background:#A6ABB1}
body.dark .heat i.h4{background:#E53935}
body.dark .heat i.empty{background:var(--surface);border-color:var(--line-strong)}
body.dark .chart svg path{stroke:var(--line)}
body.dark .chart svg polyline{stroke:var(--ink)}
body.dark .chart svg text{fill:var(--muted)}
body.dark .chart svg circle{stroke:var(--ink)}
body.dark .qr{background:#F1F3F0;border-color:var(--line-strong)}
body.dark .welcome-court{background:#15171A;border-color:var(--line)}
body.dark .welcome-court-meta{border-color:#383D43;color:#A6ABB1}
body.dark .store-selected{border-color:var(--line-strong)!important}
body.dark .side-link.on{background:var(--surface-2);color:#F1F3F0;border-color:var(--line);border-left:3px solid var(--lime)}
body.dark .side-link.on .side-num{color:#A6ABB1}

/* ---------- responsive ---------- */
.menu-toggle{display:none}
@media (max-width:1000px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:80;width:310px;transform:translateX(-100%);transition:transform .2s ease}
  .sidebar.open{transform:translateX(0)}
  .stage{padding:18px 14px 52px}
  .menu-toggle{display:inline-flex}
  .stage-head{max-width:375px}
  .device{width:min(375px,calc(100vw - 28px));height:812px}
}
@media (max-width:420px){
  .device{width:calc(100vw - 16px);height:812px;border-radius:28px}
  .stage{padding:12px 8px 40px}
  .stage-title{font-size:28px}
}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto !important;transition:none !important;animation:none !important}
}

/* ============================================================

  if(opts.disabled) attrs.push('disabled');
  const cls = ['btn', opts.tone||'', opts.sm?'sm':'', opts.block?'block':''].filter(Boolean).join(' ');
  return `<button class="${cls}" ${attrs.join(' ')}>${opts.icon?ic(opts.icon):''}${label}</button>`;
}

function qrSVG(seed=7){
  let s=seed, cells='';
  const n=21, size=4;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    s=(s*73+41)%997;
    const finder = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    const on = finder ? ((x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4)||(x>=2&&x<=4&&y>=4&&y<=6)||(y>=2&&y<=4&&x>=4&&x<=6)) ? 1 : 0) : (s%3===0?1:0);
    if(on) cells+=`<rect x="${x*size}" y="${y*size}" width="${size}" height="${size}" fill="#17191B"/>`;
  }
  return `<svg viewBox="0 0 84 84">${cells}</svg>`;
}

  <div class="row between"><div><div class="label">Seu nível</div><div class="h2">Ouro 23</div></div><div class="badge lime">3.450 XP</div></div>
  ${progress(77,'orange')}
  <div class="row between"><span class="tiny">Nível 1</span><span class="tiny">30</span></div>
  <div class="track">
    ${Array.from({length:30},(_,i)=>i+1).map(n=>{
      const milestone=[4,8,12,17,21,26,30].includes(n);
      const done=n<23, current=n===23, locked=n>23;
      return `<div class="node ${done?'done':''} ${current?'current':''} ${locked?'locked':''} ${milestone?'milestone':''}"><div class="n-lvl">${n}</div><div class="n-state">${milestone?'item':done?'ok':'XP'}</div>${milestone?`<div class="n-item">${n===30?'insígnia':'item'}</div>`:''}</div>`;
    }).join('')}
  </div>
  <div class="row between"><span class="h3">Itens da temporada</span><span class="tiny">7 itens</span></div>
  ${[[4,'Acessório de personagem','free'],[8,'Animação de lobby','pass'],[12,'Emote de chat','free'],[17,'Ícone de entrada','pass'],[21,'Acessório raro','free'],[26,'Efeito de perfil','pass'],[30,'Insígnia da temporada','free']].map(([n,name,src])=>`<div class="milestone-card ${src==='pass'?'pass':''} ${n>23?'locked':''}"><div class="m-lvl">${n}</div><div class="grow"><div class="list-title">${name}</div><div class="list-sub">${src==='pass'?'Trilha do passe · empréstimo':'Trilha free · permanente'} · ${n>23?'bloqueado por XP':'disponível'}</div></div>${badge(src==='pass'?'PASSE':'FREE',src==='pass'?'blue':'lime')}</div>`).join('')}

`));

/* ============================================================
   SHELL / NAVEGAÇÃO
   ============================================================ */
let currentId = null;
let historyStack = [];
let currentFilter = '';
const $ = sel => document.querySelector(sel);

function screenById(id){ return SCREENS.find(s=>s.id===id); }
function renderSidebar(){
  const groups = [];
  SCREENS.forEach(s=>{ let g=groups.find(x=>x.name===s.group); if(!g){g={name:s.group,items:[]};groups.push(g);} g.items.push(s); });
  const q=currentFilter.trim().toLowerCase();
  $('#screen-list').innerHTML = groups.map(g=>{
    const items=g.items.filter(s=>!q || (s.title+' '+s.id+' '+s.state).toLowerCase().includes(q));
    if(!items.length) return '';
    return `<div class="side-group"><div class="side-group-title">${g.name}</div>${items.map(s=>{
      const num=String(SCREENS.indexOf(s)+1).padStart(2,'0');
      return `<button class="side-link ${s.id===currentId?'on':''}" data-go="${s.id}"><span class="side-num">${num}</span><span>${s.title}</span></button>`;
    }).join('')}</div>`;
  }).join('') || `<div class="side-empty">Nenhuma tela encontrada.</div>`;
}
function renderTabbar(screen){
  if(!screen.chrome){ $('#tabbar').style.display='none'; return; }
  $('#tabbar').style.display='grid';
  $('#tabbar').innerHTML = TABS.map(t=>`<button class="tab ${screen.tab===t.id?'on':''}" data-tab="${t.id}">${ic(t.icon)}<span>${t.label}</span></button>`).join('');
}
function renderMeta(screen){
  $('#meta-group').textContent = screen.group;
  $('#meta-title').textContent = screen.title;
  $('#meta-state').textContent = screen.state;
  $('#meta-decision').textContent = screen.decision;
  $('#meta-count').textContent = String(SCREENS.indexOf(screen)+1).padStart(2,'0') + ' / ' + String(SCREENS.length).padStart(2,'0');
  document.title = `JOGA v3 · ${screen.title}`;
}
function navigate(id, push=true){
  const screen=screenById(id);
  if(!screen) return;
  if(push && currentId && currentId!==id) historyStack.push(currentId);
  currentId=id;
  $('#viewport').innerHTML = typeof screen.body==='function' ? screen.body() : screen.body;
  $('#viewport').scrollTop=0;
  renderTabbar(screen);
  renderMeta(screen);
  renderSidebar();
  closeModal();
  if(location.hash!==`#${id}`) history.replaceState(null,'',`#${id}`);
}
function goBack(){
  const prev=historyStack.pop();
  if(prev) navigate(prev,false);
  else navigate('home',false);
}
function showToast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('on'),2200);
}
function openModal(id){
  const MODALS={
    confirm: `<div class="sheet"><div class="sheet-handle"></div><h2>Confirmar ação?</h2><p>Esta é uma confirmação destrutiva. No protótipo, nenhum dado real é alterado.</p><div class="btn-row"><button class="btn ghost" data-close-modal>Voltar</button><button class="btn danger" data-close-modal data-toast="Ação confirmada no protótipo">Confirmar</button></div></div>`,
    cancel: `<div class="sheet"><div class="sheet-handle"></div><h2>Cancelar participação?</h2><p>Antes do cutoff, você não recebe reembolso e o sistema abre T4 para um substituto. Os demais pagantes seguem protegidos.</p><div class="btn-row"><button class="btn ghost" data-close-modal>Manter vaga</button><button class="btn danger" data-close-modal data-toast="T4 aberto no protótipo">Cancelar e abrir T4</button></div></div>`,
    logout: `<div class="sheet"><div class="sheet-handle"></div><h2>Sair da conta?</h2><p>Você precisará da passkey ou do telefone para entrar de novo.</p><div class="btn-row"><button class="btn ghost" data-close-modal>Ficar</button><button class="btn danger" data-close-modal data-toast="Sessão encerrada no protótipo">Sair</button></div></div>`,
    block: `<div class="sheet"><div class="sheet-handle"></div><h2>Bloquear Marcus_rise?</h2><p>Amizade, convites e eventos sociais serão cortados. O outro jogador não vê o motivo.</p><div class="btn-row"><button class="btn ghost" data-close-modal>Voltar</button><button class="btn danger" data-close-modal data-toast="Usuário bloqueado no protótipo">Bloquear</button></div></div>`,
    filter: `<div class="sheet"><div class="sheet-handle"></div><h2>Filtrar quadras</h2><p>Filtros são preferências, nunca anúncios.</p><div class="chip-row" style="margin-bottom:12px"><button class="chip on" data-toggle>Futebol 5x5</button><button class="chip" data-toggle>Vôlei 6x6</button><button class="chip" data-toggle>Coberta</button><button class="chip" data-toggle>Até 10 km</button></div><button class="btn primary" data-close-modal data-toast="Filtros aplicados no protótipo">Aplicar filtros</button></div>`,
    share: `<div class="sheet"><div class="sheet-handle"></div><h2>Compartilhar</h2><p>Referência interna do JOGA: partida, quadra ou lobby.</p><div class="card flat" style="margin-bottom:12px">${ic('cal','sm')} Futebol 5x5 · ter, 17 nov · 20:00</div><button class="btn primary" data-close-modal data-toast="Link copiado no protótipo">Copiar link do JOGA</button></div>`
  };
  if(!MODALS[id]) return;
  $('#modal-root').innerHTML=`<div class="modal-backdrop" data-close-modal></div>${MODALS[id]}`;
  $('#modal-root').classList.add('on');
}
function closeModal(){ $('#modal-root').classList.remove('on'); $('#modal-root').innerHTML=''; }

function applyTheme(dark){
  document.body.classList.toggle('dark', dark);
  const b=$('#theme-toggle');
  if(b) b.textContent = dark ? 'Tema claro' : 'Tema escuro';
  try { localStorage.setItem('joga-theme', dark ? 'dark' : 'light'); } catch(e){}
}
function initTheme(){
  let saved=null;
  try { saved=localStorage.getItem('joga-theme'); } catch(e){}
  applyTheme(saved==='dark');
}
function initShell(){
  initTheme();
  renderSidebar();
  const initial = location.hash ? location.hash.slice(1) : 'home';
  navigate(screenById(initial)?initial:'home', false);
  $('#screen-search').addEventListener('input', e=>{ currentFilter=e.target.value; renderSidebar(); });
  $('#prev-screen').addEventListener('click', ()=>{ const i=SCREENS.findIndex(s=>s.id===currentId); navigate(SCREENS[(i-1+SCREENS.length)%SCREENS.length].id); });
  $('#next-screen').addEventListener('click', ()=>{ const i=SCREENS.findIndex(s=>s.id===currentId); navigate(SCREENS[(i+1)%SCREENS.length].id); });
  $('#random-screen').addEventListener('click', ()=>navigate('home'));
  $('#theme-toggle').addEventListener('click', ()=>applyTheme(!document.body.classList.contains('dark')));
  $('#menu-toggle').addEventListener('click', ()=>$('#sidebar').classList.toggle('open'));
  window.addEventListener('hashchange', ()=>{ const id=location.hash.slice(1); if(screenById(id) && id!==currentId) navigate(id,false); });
}
document.addEventListener('click', e=>{
  const go=e.target.closest('[data-go]');
  if(go){ navigate(go.dataset.go); $('#sidebar').classList.remove('open'); return; }
  const back=e.target.closest('[data-back]');
  if(back){ goBack(); return; }
  const tab=e.target.closest('[data-tab]');
  if(tab){ navigate(TAB_TARGET[tab.dataset.tab]); return; }
  const modal=e.target.closest('[data-modal]');
  if(modal){ openModal(modal.dataset.modal); return; }
  const close=e.target.closest('[data-close-modal]');
  if(close){ closeModal(); return; }
  const toast=e.target.closest('[data-toast]');
  if(toast){ showToast(toast.dataset.toast); return; }
  const toggle=e.target.closest('[data-toggle]');
  if(toggle){ toggle.classList.toggle('on'); return; }
  const multi=e.target.closest('[data-multi-item]');
  if(multi){ multi.classList.toggle('on'); return; }
  const avatarTab=e.target.closest('[data-avatar-tab]');
  if(avatarTab){
    const tab=avatarTab.dataset.avatarTab;
    document.querySelectorAll('[data-avatar-tab]').forEach(b=>b.classList.toggle('on',b===avatarTab));
    document.querySelectorAll('[data-avatar-panel]').forEach(p=>p.classList.toggle('on',p.dataset.avatarPanel===tab));
    return;
  }
  const addWindow=e.target.closest('[data-add-window]');
  if(addWindow){
    const day=addWindow.dataset.addWindow;
    const target=document.getElementById('windows-'+day);
    if(target){ target.insertAdjacentHTML('beforeend','<div style="margin-top:3px">19:00–22:00</div>'); }
    showToast('Horário adicionado');
    return;
  }
  const seg=e.target.closest('[data-seg-item]');
  if(seg){ const parent=seg.closest('.seg'); if(parent){ parent.querySelectorAll('[data-seg-item]').forEach(b=>b.classList.remove('on')); seg.classList.add('on'); } return; }
  const select=e.target.closest('[data-select-item]');
  if(select){ const parent=select.closest('[data-select]'); if(parent){ parent.querySelectorAll('[data-select-item]').forEach(b=>b.classList.remove('on')); select.classList.add('on'); } return; }
});
initShell();
</script>
</body>
</html>
