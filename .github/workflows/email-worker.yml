name: Email worker (Outbox)

# O Render free não mantém worker: o serviço web dorme e `--loop` não roda.
# Este workflow drena a Outbox a cada 5 minutos, fora do web service.
#
# Perfil do demo: development + PSP simulator. Não há PSP real no demo, então
# o job NÃO usa credenciais do Mercado Pago. Para um ambiente com PSP real,
# defina os repository variables JOGA_ENVIRONMENT=production e
# JOGA_PSP_PROVIDER=mercadopago e configure os secrets do PSP (ver RUNBOOK).
#
# Secrets obrigatórios no repositório:
#   JOGA_DATABASE_URL          (postgresql+psycopg://... pelo Session pooler IPv4)
#   JOGA_EMAIL_API_KEY
#   JOGA_EMAIL_FROM
# Opcional: JOGA_EMAIL_REPLY_TO.
#
# O runner do GitHub precisa alcançar o PostgreSQL. Com Supabase, use a URL do
# Session pooler (IPv4); o host direto é IPv6 e não é alcançável.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-worker
  cancel-in-progress: false

jobs:
  deliver:
    name: Drenar Outbox de e-mail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      JOGA_ENVIRONMENT: ${{ vars.JOGA_ENVIRONMENT || 'development' }}
      JOGA_LOG_LEVEL: INFO
      JOGA_DATABASE_URL: ${{ secrets.JOGA_DATABASE_URL }}
      JOGA_AUTH_EMAIL_ENABLED: "true"
      JOGA_AUTH_PHONE_ENABLED: "false"
      JOGA_ALLOW_EMAIL_REGISTRATION: "true"
      JOGA_ALLOW_PHONE_REGISTRATION: "false"
      JOGA_PHONE_REQUIRED_FOR_BOOKING: "false"
      JOGA_SIGNUP_MODE: open
      JOGA_EMAIL_PROVIDER: brevo
      JOGA_EMAIL_API_KEY: ${{ secrets.JOGA_EMAIL_API_KEY }}
      JOGA_EMAIL_FROM: ${{ secrets.JOGA_EMAIL_FROM }}
      JOGA_EMAIL_FROM_NAME: JOGA
      JOGA_EMAIL_REPLY_TO: ${{ secrets.JOGA_EMAIL_REPLY_TO }}
      JOGA_EMAIL_DAILY_BUDGET: "250"
      JOGA_PSP_PROVIDER: ${{ vars.JOGA_PSP_PROVIDER || 'simulator' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements.lock
      - name: Validar configuração de e-mail
        run: |
          python -c "from app.core.config import get_settings; s = get_settings(); assert s.auth_email_enabled; assert s.email_provider != 'none'; print('config ok')"
      - name: Drenar Outbox (uma execução)
        run: python -m scripts.deliver_emails --once
