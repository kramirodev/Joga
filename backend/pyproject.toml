[project]
name = "joga-backend"
version = "0.1.0"
description = "API do JOGA — fundação de engenharia"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.2",
  "SQLAlchemy==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
