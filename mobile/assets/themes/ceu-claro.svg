<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Céu de papel com sol vermelho, aros de marquise e nuvens rosadas">
  <defs>
    <linearGradient id="paperSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf8"/>
      <stop offset=".52" stop-color="#f6f2eb"/>
      <stop offset=".82" stop-color="#efece6"/>
      <stop offset="1" stop-color="#e9e3d9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ed5145" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#ed5145" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ed5145" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc" cx=".38" cy=".34" r=".72">
      <stop offset="0" stop-color="#ff8a7e"/>
      <stop offset=".5" stop-color="#ed5145"/>
      <stop offset=".86" stop-color="#d92f24"/>
      <stop offset="1" stop-color="#a51f1a"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d92f24" stop-opacity="0"/>
      <stop offset=".45" stop-color="#d92f24" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8e8c87" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efece6" stop-opacity="0"/>
      <stop offset=".6" stop-color="#efece6" stop-opacity=".78"/>
      <stop offset="1" stop-color="#efece6"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grainLight">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#paperSky)"/>

  <!-- aros de marquise -->
  <g fill="none" stroke="#0d0d0c" stroke-opacity=".11" stroke-width="1.5">
    <circle cx="892" cy="248" r="216"/>
    <circle cx="892" cy="248" r="292"/>
    <circle cx="892" cy="248" r="372"/>
  </g>

  <!-- sol -->
  <circle cx="892" cy="248" r="320" fill="url(#sunGlow)"/>
  <circle cx="892" cy="248" r="150" fill="url(#sunDisc)"/>
  <circle cx="892" cy="248" r="150" fill="none" stroke="#fdfbf8" stroke-opacity=".8" stroke-width="2.5"/>
  <circle cx="892" cy="248" r="186" fill="none" stroke="#d92f24" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="892" cy="248" r="216" fill="none" stroke="#0d0d0c" stroke-opacity=".12" stroke-width="1.5"/>

  <!-- nuvens rosadas -->
  <g fill="url(#cloud)" filter="url(#blur30)">
    <ellipse cx="272" cy="386" rx="340" ry="42" opacity=".9"/>
    <ellipse cx="760" cy="468" rx="390" ry="36" opacity=".6"/>
    <ellipse cx="1084" cy="340" rx="250" ry="26" opacity=".42"/>
  </g>

  <!-- marquise / estrutura ao fundo -->
  <g stroke="#0d0d0c" stroke-opacity=".12" fill="none">
    <path d="M-40 742c200-108 440-160 640-160s440 52 640 160" stroke-width="2"/>
    <path d="M-40 782c200-108 440-160 640-160s440 52 640 160" stroke-width="1"/>
  </g>
  <g fill="#d92f24" opacity=".5">
    <circle cx="196" cy="704" r="3"/><circle cx="268" cy="680" r="3"/><circle cx="344" cy="660" r="3"/>
    <circle cx="424" cy="646" r="3"/><circle cx="508" cy="636" r="3"/><circle cx="596" cy="631" r="3"/>
    <circle cx="688" cy="634" r="3"/><circle cx="776" cy="642" r="3"/><circle cx="860" cy="656" r="3"/>
    <circle cx="940" cy="676" r="3"/><circle cx="1016" cy="700" r="3"/><circle cx="1088" cy="728" r="3"/>
  </g>

  <rect y="560" width="1200" height="340" fill="url(#bottomFade)"/>
  <rect width="1200" height="900" filter="url(#grainLight)" opacity=".9"/>
</svg>
