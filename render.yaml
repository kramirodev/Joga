# Blueprint do ambiente de DEMONSTRACAO no Render.
#
# - um unico web service Docker (Caddy + uvicorn + SPA);
# - plano free; nenhum disco persistente, banco ou recurso pago;
# - health check aberto em /api/v1/health/ready;
# - segredos ficam no dashboard (sync: false), nunca neste arquivo.
#
# O host publico e <nome-do-servico>.onrender.com. Se o Render atribuir outro
# nome porque "joga-demo" ja existe, ajuste JOGA_WEBAUTHN_ORIGIN_WEB depois da
# criacao (JOGA_WEBAUTHN_RP_ID se auto-referencia por RENDER_EXTERNAL_HOSTNAME).
#
# Este blueprint nao governa o servico em execucao: a fonte da verdade e o
# dashboard do Render. O perfil esperado do ambiente e `demo`
# (JOGA_ENVIRONMENT=demo). Deploys sao manuais, por isso autoDeploy: false.

services:
  - type: web
    name: joga-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    envVars:
      - key: JOGA_ENVIRONMENT
        value: demo
      - key: JOGA_DATABASE_URL
        sync: false
      - key: JOGA_PHONE_HASH_SECRET
        sync: false
      - key: JOGA_TOKEN_HASH_SECRET
        sync: false
      - key: JOGA_CPF_KEY
        sync: false
      - key: JOGA_CPF_KEY_ID
        value: k1
      - key: JOGA_AUTH_EMAIL_ENABLED
        value: "true"
      - key: JOGA_AUTH_PHONE_ENABLED
        value: "false"
      - key: JOGA_ALLOW_EMAIL_REGISTRATION
        value: "true"
      - key: JOGA_ALLOW_PHONE_REGISTRATION
        value: "false"
      - key: JOGA_PHONE_REQUIRED_FOR_BOOKING
        value: "false"
      # Cadastro aberto no demo (decisão de 2026-11-19). Emergência: fechar no
      # dashboard (o serviço não é gerenciado por blueprint); este arquivo só
      # muda por commit.
      - key: JOGA_SIGNUP_MODE
        value: open
      # Limites do perfil beta explícitos para não depender de default.
      - key: JOGA_SIGNUP_MAX_PER_IP_PER_DAY
        value: "20"
      - key: JOGA_EMAIL_MAX_PER_ADDRESS_PER_HOUR
        value: "5"
      - key: JOGA_EMAIL_MAX_PER_IP_PER_HOUR
        value: "50"
      - key: JOGA_EMAIL_PROVIDER
        value: brevo
      - key: JOGA_EMAIL_API_KEY
        sync: false
      - key: JOGA_EMAIL_FROM
        value: kramirodev@gmail.com
      - key: JOGA_EMAIL_FROM_NAME
        value: JOGA
      - key: JOGA_EMAIL_DAILY_BUDGET
        value: "250"
      # Drenagem da Outbox no processo da API: o cron do GitHub não entrega em
      # até 15 min de forma confiável. O workflow continua como reserva.
      - key: JOGA_EMAIL_INLINE_DRAIN_ENABLED
        value: "true"
      - key: JOGA_EMAIL_INLINE_DRAIN_INTERVAL_SECONDS
        value: "30"
      - key: JOGA_WEB_COOKIE_SECURE
        value: "true"
      - key: JOGA_APP_VERSION_GATE_ENABLED
        value: "true"
      - key: JOGA_MIN_APP_VERSION
        value: 1.0.1
      - key: JOGA_LATEST_APP_VERSION
        value: 1.0.1
      - key: JOGA_PSP_PROVIDER
        value: simulator
      - key: JOGA_MONEY_MODE
        value: simulated
      - key: JOGA_FISCAL_MODE
        value: disabled
      - key: JOGA_CUSTODY_MODEL
        value: B
      - key: JOGA_WEBAUTHN_RP_ID
        fromService:
          type: web
          name: joga-demo
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: JOGA_WEBAUTHN_ORIGIN_WEB
        # Preenchido no dashboard/API com https://<host-do-demo>. Nao versionar
        # a URL real do ambiente de demonstracao em repositorio publico.
        sync: false
      - key: JOGA_MEDIA_ROOT
        value: /app/backend/var/media
      - key: DEMO_BASIC_AUTH_HASH
        sync: false
